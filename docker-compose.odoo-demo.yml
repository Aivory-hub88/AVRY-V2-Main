version: '3.8'

# ─── Aivory Odoo Demo — persistent demo instance for prospect demos ──────────
# URL: https://odoo.aivory.id (wildcard *.aivory.id already points to VPS)
# Usage:
#   docker compose -f docker-compose.odoo-demo.yml up -d
#   ./ops/odoo-demo/seed_demo.py --scenario retail   # inject data before demo
#   ./ops/odoo-demo/reset_demo.sh                    # wipe after demo
#
# Data flow:
#   inject (seed_demo.py via XML-RPC) -> demo -> reset (drop + restore golden)
# ─────────────────────────────────────────────────────────────────────────────

services:
  odoo-demo-db:
    image: postgres:15
    container_name: aivory-odoo-demo-db
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=${ODOO_DB_PASSWORD:?set ODOO_DB_PASSWORD in .env}
      - POSTGRES_DB=postgres
    volumes:
      - odoo_demo_db:/var/lib/postgresql/data
      # golden dump lives on host so reset works even after volume wipe
      - ./ops/odoo-demo/golden:/golden:ro
    networks:
      - aivory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo-demo:
    image: odoo:18
    container_name: aivory-odoo-demo
    depends_on:
      odoo-demo-db:
        condition: service_healthy
    environment:
      - HOST=odoo-demo-db
      - USER=odoo
      - PASSWORD=${ODOO_DB_PASSWORD:?set ODOO_DB_PASSWORD in .env}
      - ADMIN_PASSWORD=${ODOO_MASTER_PASSWORD:?set ODOO_MASTER_PASSWORD in .env}
      - PROXY_MODE=True
    volumes:
      - odoo_demo_data:/var/lib/odoo
      - ./services/aivory-cerveau-odoo/addons:/mnt/extra-addons:ro
    networks:
      - aivory-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.odoo-demo.rule=Host(`odoo.aivory.id`)"
      - "traefik.http.routers.odoo-demo.entrypoints=websecure"
      - "traefik.http.routers.odoo-demo.tls.certresolver=letsencrypt"
      - "traefik.http.services.odoo-demo.loadbalancer.server.port=8069"

volumes:
  odoo_demo_db:
  odoo_demo_data:

networks:
  aivory-network:
    name: aivory-network
    external: true
