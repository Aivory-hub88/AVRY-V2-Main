# Installed as /etc/systemd/system/cognee-cerveau.service.d/watchdog.conf
# Companion to cognee-cerveau-watchdog.{service,timer}. See
# docs/INCIDENT-2026-10-03-COGNEE-CERVEAU-HANG.md.
[Unit]
# The watchdog's own restarts count toward the start limit; the default
# (5 in 10 s) is fine for crash loops but leave room for watchdog restarts
# plus a crash or two without the unit getting stuck in `failed`.
StartLimitIntervalSec=600
StartLimitBurst=10

[Service]
# A clean exit (status 0) of a server that should never exit is still an outage.
Restart=always
RestartSec=5
# A hung process ignores SIGTERM-driven shutdown as readily as it ignores
# /health; don't let a watchdog restart sit for the default 90 s before SIGKILL.
TimeoutStopSec=15
