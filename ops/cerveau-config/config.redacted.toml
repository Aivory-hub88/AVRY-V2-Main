tools = ["tenant_odoo__odoo_read_group", "tenant_odoo__odoo_search", "tenant_odoo__odoo_search_read", "tenant_odoo__odoo_read", "tenant_odoo__odoo_count", "tenant_odoo__odoo_list_models", "tenant_odoo__odoo_get_model_metadata", "tenant_odoo__odoo_check_access", "tenant_odoo__odoo_generate_report", "tenant_odoo__odoo_list_instances"]
