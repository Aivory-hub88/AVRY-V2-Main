# Writes (Google Sheets/Docs/Drive report files) are deliberately NOT in
# auto_approve: each parks as an approval until we have canary data on how
# often Ivo saves reports. No delegation_policy block: mode defaults to
# "forbidden" (ADR-008); Aira delegates TO Ivo, Ivo does not delegate onward.

[runtime_profiles.agent_data_analyst]
agentic = true
max_delegation_depth = 1
max_tool_iterations = 10
parallel_tools = true
prompt_injection_mode = "compact"

[[runtime_profiles.agent_data_analyst.tool_filter_groups]]
