services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: avry-postgres
    restart: unless-stopped
    networks:
      - aivory-network
    environment:
      - POSTGRES_USER=aivory
      - POSTGRES_PASSWORD=5FeYfB9RtX4MwaHRmLdltWZUPof3E5igoUHafCcG
      - POSTGRES_DB=aivory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivory -d aivory"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "5432:5432"

  # ── Traefik ────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v2.11
    container_name: avry-traefik
    restart: unless-stopped
    networks:
      - aivory-network
      - avry-mail-web-edge
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/ubuntu/AVRY-V2-Main/traefik/dynamic:/etc/traefik/dynamic:ro
      - /home/ubuntu/AVRY-V2-Main/traefik/letsencrypt:/letsencrypt
      - /home/ubuntu/AVRY-V2-Main/traefik/secrets:/etc/traefik/secrets:ro
      - /home/ubuntu/AVRY-V2-Main/traefik/logs:/var/log/traefik
    environment:
      - CF_DNS_API_TOKEN_FILE=/etc/traefik/secrets/cf-dns-token
    command:
      - "--api.insecure=false"
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=aivory-network"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.middlewares=aivory-secure@file"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.middlewares=aivory-secure@file"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@aivory.id"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--experimental.plugins.crowdsec-bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.crowdsec-bouncer.version=v1.8.1"

  # ── Main Website (landing, /blog, /careers — catch-all priority=1) ─────────
  avry-website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.aivory.id
        NEXT_PUBLIC_BACKEND_URL: https://api.aivory.id
        NEXT_PUBLIC_BLOG_URL: /api/blog
        NEXT_PUBLIC_CAREERS_URL: /api/careers
        NEXT_PUBLIC_DIAGNOSTICS_URL: https://api.aivory.id/diagnostics
        NEXT_PUBLIC_BLUEPRINT_URL: https://api.aivory.id/blueprint
        NEXT_PUBLIC_ADMIN_DASHBOARD_URL: https://admin.aivory.id/admin
        NEXT_PUBLIC_WORKFLOWS_URL: https://api.aivory.id/workflows
        NEXT_PUBLIC_PAYMENTS_URL: https://api.aivory.id/payments
        NEXT_PUBLIC_ROADMAP_URL: https://api.aivory.id/roadmap
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAESmFOravtG7NiWO
    container_name: avry-website
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --timeout=3 http://127.0.0.1:3000/favicon.ico || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - aivory-network
    environment:
      - HONEYPOT_INGEST_TOKEN=${HONEYPOT_INGEST_TOKEN}
      # Server-side only: /api/turnstile/verify exchanges the widget token
      # with Cloudflare. The sitekey in the build args above is public; this is not.
      - TURNSTILE_SECRET=${TURNSTILE_SECRET}
      - TURNSTILE_HOSTNAMES=${TURNSTILE_HOSTNAMES}
      - BACKEND_SERVICE_URL=http://avry-backend:8081
      # Free-assessment lead capture + report email. Without these the
      # routes fail closed with 503 and every lead is silently dropped.
      - LEAD_INGEST_TOKEN=${LEAD_INGEST_TOKEN}
      - N8N_REPORT_WEBHOOK_URL=${N8N_REPORT_WEBHOOK_URL}
      - REPORT_EMAIL_TOKEN=${REPORT_EMAIL_TOKEN}
      # Contact page + homepage transformation-intake form.
      - N8N_CONTACT_WEBHOOK_URL=${N8N_CONTACT_WEBHOOK_URL}
      - CONTACT_FORM_TOKEN=${CONTACT_FORM_TOKEN}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aivory-network"
      - "traefik.http.routers.main-app.rule=(Host(`aivory.id`) || Host(`www.aivory.id`) || Host(`stag.aivory.id`) || Host(`x.aivory.uk`)) && PathPrefix(`/`)"
      - "traefik.http.routers.main-app.middlewares=aivory-csp-strict@file"
      - "traefik.http.routers.main-app.entrypoints=websecure,web"
      - "traefik.http.routers.main-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.main-app.priority=1"
      - "traefik.http.routers.main-app-api.rule=(Host(`aivory.id`) || Host(`www.aivory.id`) || Host(`stag.aivory.id`) || Host(`x.aivory.uk`)) && (PathPrefix(`/api/exchange-rate`) || PathPrefix(`/api/turnstile`) || PathPrefix(`/api/assessment-lead`) || PathPrefix(`/api/assessment-report-email`) || PathPrefix(`/api/assessment-event`) || PathPrefix(`/api/contact-form`))"
      - "traefik.http.routers.main-app-api.entrypoints=websecure,web"
      - "traefik.http.routers.main-app-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.main-app-api.priority=20"
      - "traefik.http.routers.main-app-trap.rule=(Host(`aivory.id`) || Host(`www.aivory.id`) || Host(`stag.aivory.id`) || Host(`x.aivory.uk`)) && (PathPrefix(`/api/internal`) || PathPrefix(`/api/v2/config`) || PathPrefix(`/api/admin/settings`))"
      - "traefik.http.routers.main-app-trap.entrypoints=websecure,web"
      - "traefik.http.routers.main-app-trap.tls.certresolver=letsencrypt"
      - "traefik.http.routers.main-app-trap.priority=20"
      - "traefik.http.routers.main-app-trap.service=main-app"
      - "traefik.http.services.main-app.loadbalancer.server.port=3000"
      # Remove from LB pool when not ready; prevents 502 during deploys
      - "traefik.http.services.main-app.loadbalancer.healthcheck.path=/favicon.ico"
      - "traefik.http.services.main-app.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.main-app.loadbalancer.healthcheck.timeout=3s"

  # ── User Dashboard (port 9001) ─────────────────────────────────────────────
  avry-user-dashboard:
    build:
      context: ./frontend/avry-user-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.aivory.id
        NEXT_PUBLIC_BACKEND_URL: https://api.aivory.id
        NEXT_PUBLIC_DIAGNOSTICS_URL: https://api.aivory.id/diagnostics
        NEXT_PUBLIC_BLUEPRINT_URL: https://api.aivory.id/blueprint
        NEXT_PUBLIC_ADMIN_DASHBOARD_URL: https://admin.aivory.id/admin
        NEXT_PUBLIC_WORKFLOWS_URL: https://api.aivory.id/workflows
        NEXT_PUBLIC_PAYMENTS_URL: https://api.aivory.id/payments
        NEXT_PUBLIC_ROADMAP_URL: https://api.aivory.id/roadmap
        NEXT_PUBLIC_SLACK_APP_ID: A0BF382BKB9
    container_name: avry-user-dashboard
    restart: unless-stopped
    networks:
      - aivory-network
      - aivory_aivory-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9001:9001"
    volumes:
      # Workflow/canvas JSON stores (.data) survive redeploys. It used to be baked
      # into the image, so every deploy reset it and deleted workflows came back.
      - avry-dashboard-data:/app/.data
    environment:
      - PORT=9001
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://aivory.id/dashboard
      # ── Backend services (no compromised defaults — requireEnv enforces these)
      - VPS_BRIDGE_URL=http://host.docker.internal:3003
      - ZEROCLAW_WEBHOOK_URL=http://host.docker.internal:3003/webhook
      - N8N_AS_CODE_URL=http://host.docker.internal:3500
      - N8N_BASE_URL=http://n8n:5678
      - N8N_PUBLIC_URL=https://n8n.aivory.id
      - APPROVAL_REGISTRATION_TOKEN=${APPROVAL_REGISTRATION_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - N8N_CREDENTIALS_ENCRYPTION_KEY=${N8N_CREDENTIALS_ENCRYPTION_KEY}
      - KAPSO_API_KEY=${KAPSO_API_KEY}
      - KAPSO_PHONE_NUMBER_ID=${KAPSO_PHONE_NUMBER_ID}
      - KAPSO_WEBHOOK_SECRET=${KAPSO_WEBHOOK_SECRET}
      - KAPSO_CRM_TENANT_ID=${KAPSO_CRM_TENANT_ID}
      - KAPSO_DISPLAY_PHONE=${KAPSO_DISPLAY_PHONE}
      - WHATSAPP_WEBHOOK_BASE=${WHATSAPP_WEBHOOK_BASE}
      - DASHBOARD_AGENT_TURN_TOKEN=${DASHBOARD_AGENT_TURN_TOKEN}
      - N8N_API_KEY=${N8N_API_KEY}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - COMPOSIO_REDIRECT_URL=${COMPOSIO_REDIRECT_URL}
      - COLLAB_URL=http://aivory-collab:3200
      - COLLAB_SERVICE_TOKEN=${COLLAB_SERVICE_TOKEN}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - CRM_URL=http://avry-crm:8091
      - CRM_SERVICE_TOKEN=${CRM_SERVICE_TOKEN}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aivory-network"
      - "traefik.http.routers.user-dashboard.rule=(Host(`aivory.id`) || Host(`www.aivory.id`) || Host(`stag.aivory.id`) || Host(`dashboard.aivory.id`) || Host(`app.aivory.id`)) && PathPrefix(`/dashboard`)"
      - "traefik.http.routers.user-dashboard.middlewares=aivory-csp-strict@file"
      - "traefik.http.routers.user-dashboard.entrypoints=web,websecure"
      - "traefik.http.routers.user-dashboard.tls=true"
      - "traefik.http.routers.user-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.user-dashboard.priority=10"
      - "traefik.http.services.user-dashboard.loadbalancer.server.port=9001"
      # Browser-side fetches go to /api/* (without basePath). Traefik adds the
      # /dashboard prefix before forwarding so Next.js basePath router matches.
      # Priority 5 < blog/careers (10) so those keep going to their services.
      - "traefik.http.routers.user-dashboard-api.rule=(Host(`aivory.id`) || Host(`www.aivory.id`) || Host(`stag.aivory.id`) || Host(`dashboard.aivory.id`) || Host(`app.aivory.id`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.user-dashboard-api.entrypoints=web,websecure"
      - "traefik.http.routers.user-dashboard-api.tls=true"
      - "traefik.http.routers.user-dashboard-api.priority=5"
      - "traefik.http.routers.user-dashboard-api.service=user-dashboard"
      - traefik.http.routers.user-dashboard-api.middlewares=user-dashboard-api-prefix
      - traefik.http.middlewares.user-dashboard-api-prefix.addprefix.prefix=/dashboard
      # dashboard dedicated host to canonical path-based origin
      - "traefik.http.routers.user-dashboard-uk.rule=Host(`dashboard.aivory.uk`)"
      - "traefik.http.routers.user-dashboard-uk.entrypoints=web,websecure"
      - "traefik.http.routers.user-dashboard-uk.tls=true"
      - "traefik.http.routers.user-dashboard-uk.tls.certresolver=letsencrypt"
      - "traefik.http.routers.user-dashboard-uk.priority=20"
      - "traefik.http.routers.user-dashboard-uk.service=user-dashboard"
      - "traefik.http.routers.user-dashboard-uk.middlewares=user-dashboard-uk-redirect,aivory-csp-strict@file"
      - "traefik.http.middlewares.user-dashboard-uk-redirect.redirectregex.regex=^https://dashboard\\.aivory\\.uk/(.*)"
      - "traefik.http.middlewares.user-dashboard-uk-redirect.redirectregex.replacement=https://aivory.uk/dashboard/$${1}"
      - "traefik.http.middlewares.user-dashboard-uk-redirect.redirectregex.permanent=true"
  # ── Aivory Console (standalone chat console) — console.aivory.id:8086 ──
  avry-console:
    build:
      context: ./services/avry-console
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://backend.aivory.id
        NEXT_PUBLIC_CONSOLE_URL: https://console.aivory.id
        NEXT_PUBLIC_N8N_EDITOR_BASE_URL: https://n8n.aivory.id
    container_name: avry-console
    restart: unless-stopped
    networks:
      - aivory-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8086:8086"
    environment:
      - N8N_BASE_URL=http://n8n:5678
      - N8N_AS_CODE_URL=http://host.docker.internal:3500
      - ZEROCLAW_WEBHOOK_URL=http://host.docker.internal:3003/webhook
      - PORT=8086
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://backend.aivory.id
      - NEXT_PUBLIC_CONSOLE_URL=https://console.aivory.id
      - VPS_BRIDGE_URL=http://host.docker.internal:3003
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8086/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aivory-network"
      - "traefik.http.routers.avry-console.rule=Host(`console.aivory.id`)"
      - "traefik.http.routers.avry-console.middlewares=aivory-csp-strict@file"
      - "traefik.http.routers.avry-console.entrypoints=websecure"
      - "traefik.http.routers.avry-console.tls=true"
      - "traefik.http.routers.avry-console.tls.certresolver=letsencrypt"
      - "traefik.http.services.avry-console.loadbalancer.server.port=8086"
  # ── Collab (y-octo + OctoBase) — aivory-collab:3200 ──────────────────────
  aivory-collab:
    build:
      context: ./services/collab
      dockerfile: Dockerfile
    container_name: aivory-collab
    restart: unless-stopped
    networks:
      - aivory-network
    ports:
      - "3201:3200"
    environment:
      - PORT=3200
      - RUST_LOG=${RUST_LOG:-info}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - COLLAB_SERVICE_TOKEN=${COLLAB_SERVICE_TOKEN}
      - OCTOBASE_PATH=/data
    volumes:
      - collab_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aivory-network"
      - "traefik.http.routers.collab.rule=PathPrefix(`/yjs`)"
      - "traefik.http.routers.collab.entrypoints=web,websecure"
      - "traefik.http.routers.collab.tls=true"
      - "traefik.http.routers.collab.tls.certresolver=letsencrypt"
      - "traefik.http.routers.collab.priority=100"
      - "traefik.http.services.collab.loadbalancer.server.port=3200"

  # ── Admin Dashboard (port 9002) ────────────────────────────────────────────
  avry-admin-dashboards:
    build:
      context: ./frontend/avry-admin-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.aivory.id
        NEXT_PUBLIC_BLOG_SERVICE_URL: /api/blog
        NEXT_PUBLIC_CAREERS_SERVICE_URL: /api/careers
        NEXT_PUBLIC_CAREERS_URL: /api/careers
        NEXT_PUBLIC_BACKEND_URL: https://api.aivory.id
    container_name: avry-admin-dashboards
    restart: unless-stopped
    networks:
      - aivory-network
    ports:
      - "9002:9002"
    environment:
      - PORT=9002
      - NODE_ENV=production
      - BACKEND_SERVICE_URL=http://avry-backend:8081
      - PAYMENTS_SERVICE_URL=http://avry-payments:3030
      - DIAGNOSTICS_SERVICE_URL=http://avry-diagnostics:8082
      - BLUEPRINT_SERVICE_URL=http://avry-blueprint:8083
      - ROADMAP_SERVICE_URL=http://avry-roadmap:8084
      - WORKFLOWS_SERVICE_URL=http://avry-workflows:8082
      - VPS_PANEL_API_TOKEN=${VPS_PANEL_API_TOKEN}
      - BLOG_SERVICE_URL=http://avry-blog:8089
      - CAREERS_SERVICE_URL=http://avry-careers:8090
      - SETUP_SECRET=${INTERNAL_TOKEN:-aivory-internal-2026}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aivory-network"
      - "traefik.http.routers.admin-app.rule=(Host(`aivory.id`) || Host(`www.aivory.id`) || Host(`stag.aivory.id`) || Host(`admin.aivory.id`)) && PathPrefix(`/admin`)"
      - "traefik.http.routers.admin-app.middlewares=aivory-csp-strict@file"
      - "traefik.http.routers.admin-app.entrypoints=web,websecure"
      - "traefik.http.routers.admin-app.tls=true"
      - "traefik.http.routers.admin-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.admin-app.priority=10"
      - "traefik.http.services.admin-app.loadbalancer.server.port=9002"

  # ── Backend API (port 8081) ────────────────────────────────────────────────
  avry-backend:
    build:
      context: ./backend/avry-backend
      dockerfile: Dockerfile
    container_name: avry-backend
    restart: unless-stopped
    networks:
      - aivory-network
    ports:
      - "8081:8081"
    environment:
      - N8N_BASE_URL=http://n8n:5678
      - PORT=8081
      - DASHBOARD_AGENT_TURN_TOKEN=${DASHBOARD_AGENT_TURN_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
      - ROOM_REMINDER_SWEEPER_ENABLED=true
      - DASHBOARD_INTERNAL_URL=http://avry-user-dashboard:9001/dashboard
      - LEAD_INGEST_TOKEN=${LEAD_INGEST_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ENVIRONMENT=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - TELEGRAM_AGENT_GATEWAY_URL=${TELEGRAM_AGENT_GATEWAY_URL:-}
      - TELEGRAM_GATEWAY_TOKEN=${TELEGRAM_GATEWAY_TOKEN:-}
      # Shared secret avry-payments sends as X-Internal-Token when it grants
      # a paid order (/api/v1/entitlements/internal/grant). Without it the
      # backend falls back to TELEGRAM_GATEWAY_TOKEN, which differs, and every
      # paid order fails with 403 (paid_grant_failed). Fixed on prod 2026-10-19.
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      # Cloudflare Turnstile on /auth/register (avry-backend#42); same values the landing uses.
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      - TURNSTILE_HOSTNAMES=${TURNSTILE_HOSTNAMES:-}
      - OD_MCP_ADMIN_TOKEN=${OD_MCP_ADMIN_TOKEN:-}
      - TELEGRAM_BOT_TOKEN_CUSTOMER_SERVICE=${TELEGRAM_BOT_TOKEN_CUSTOMER_SERVICE:-}
      - TELEGRAM_BOT_USERNAME_CUSTOMER_SERVICE=${TELEGRAM_BOT_USERNAME_CUSTOMER_SERVICE:-}
      - TELEGRAM_BOT_TOKEN_LEADS_QUALIFIER=${TELEGRAM_BOT_TOKEN_LEADS_QUALIFIER:-}
      - TELEGRAM_BOT_USERNAME_LEADS_QUALIFIER=${TELEGRAM_BOT_USERNAME_LEADS_QUALIFIER:-}
      - TELEGRAM_BOT_TOKEN_FINANCE_INVOICE_OPS=${TELEGRAM_BOT_TOKEN_FINANCE_INVOICE_OPS:-}
      - TELEGRAM_BOT_USERNAME_FINANCE_INVOICE_OPS=${TELEGRAM_BOT_USERNAME_FINANCE_INVOICE_OPS:-}
      - TELEGRAM_BOT_TOKEN_OFFICE_ASSISTANT=${TELEGRAM_BOT_TOKEN_OFFICE_ASSISTANT:-}
      - TELEGRAM_BOT_USERNAME_OFFICE_ASSISTANT=${TELEGRAM_BOT_USERNAME_OFFICE_ASSISTANT:-}
      - TELEGRAM_BOT_TOKEN_CHIEF_OF_STAFF=${TELEGRAM_BOT_TOKEN_CHIEF_OF_STAFF:-}
      - TELEGRAM_BOT_USERNAME_CHIEF_OF_STAFF=${TELEGRAM_BOT_USERNAME_CHIEF_OF_STAFF:-}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID:-}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - HONEYPOT_INGEST_TOKEN=${HONEYPOT_INGEST_TOKEN}
      - MCP_SERVER_AUTH_ENCRYPTION_KEY=${MCP_SERVER_AUTH_ENCRYPTION_KEY}
      - CERVEAU_WEBHOOK_SECRET=${CERVEAU_WEBHOOK_SECRET}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Password-reset mail. Same relay avry-careers/avry-payments already use;
      # with SMTP_HOST unset the reset endpoints still work but no link is
      # delivered, so this must be present for self-service reset to function.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      # The shared SMTP identity is careers@ — wrong voice for a security
      # email, so account mail gets its own sender when one is configured.
      - AUTH_FROM_EMAIL=${AUTH_FROM_EMAIL:-}
      # Where the emailed links point. The admin base needs the /admin segment:
      # the dashboard runs under Next.js basePath "/admin".
      - PASSWORD_RESET_URL_BASE=${PASSWORD_RESET_URL_BASE:-https://aivory.uk/reset-password}
      - ADMIN_PASSWORD_RESET_URL_BASE=${ADMIN_PASSWORD_RESET_URL_BASE:-https://admin.aivory.id/admin/reset-password}
      - PASSWORD_RESET_TTL_MINUTES=${PASSWORD_RESET_TTL_MINUTES:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - avry-backend-data:/app/data
      - /home/ubuntu/mcp-image-releases:/data/mcp-image-releases:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aivory-network"
      - "traefik.http.routers.backend.rule=(Host(`api.aivory.id`) || Host(`backend.aivory.id`)) && (PathPrefix(`/api/v1`) || PathPrefix(`/api/database`) || PathPrefix(`/api/debug`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend.entrypoints=web,websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.services.backend.loadbalancer.server.port=8081"
      - "traefik.http.services.backend.loadbalancer.responseForwarding.flushInterval=100ms"  # SSE prep: streaming Console/Cerveau path (2026-09-10), harmless for plain JSON responses
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # ── Blog API (port 8089 — /api/blog via Traefik priority=10) ──────────────
  avry-blog:
    build:
      context: ./services/avry-blog
      dockerfile: Dockerfile
    container_name: avry-blog
    restart: unless-stopped
    networks:
      - aivory-network
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aivory-network"
      - "traefik.http.routers.blog.rule=PathPrefix(`/api/blog`)"
      - "traefik.http.routers.blog.entrypoints=web,websecure"
      - "traefik.http.routers.blog.tls.certresolver=letsencrypt"
      - "traefik.http.routers.blog.priority=10"
      - "traefik.http.services.blog.loadbalancer.server.port=8089"
      - "traefik.http.routers.blog.middlewares=blog-stripprefix"
      - "traefik.http.middlewares.blog-stripprefix.stripprefix.prefixes=/api/blog"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Careers API (port 8090 — /api/careers via Traefik priority=10) ────────
  avry-careers:
    build:
      context: ./services/avry-careers
      dockerfile: Dockerfile
    container_name: avry-careers
    restart: unless-stopped
    networks:
      - aivory-network
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-careers@aivory.id}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aivory-network"
      - "traefik.http.routers.careers.rule=PathPrefix(`/api/careers`)"
      - "traefik.http.routers.careers.entrypoints=web,websecure"
      - "traefik.http.routers.careers.tls.certresolver=letsencrypt"
      - "traefik.http.routers.careers.priority=10"
      - "traefik.http.services.careers.loadbalancer.server.port=8090"
      - "traefik.http.routers.careers.middlewares=careers-stripprefix"
      - "traefik.http.middlewares.careers-stripprefix.stripprefix.prefixes=/api/careers"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Diagnostics (port 8082) ────────────────────────────────────────────────
  avry-diagnostics:
    build:
      context: ./services/avry-diagnostics
      dockerfile: Dockerfile
    container_name: avry-diagnostics
    restart: unless-stopped
    networks:
      - aivory-network
    ports:
      - "8082:8082"
    environment:
      - N8N_BASE_URL=http://n8n:5678
      - PORT=8082
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8082/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aivory-network"
      - "traefik.http.routers.diagnostics.rule=Host(`api.aivory.id`) && PathPrefix(`/diagnostics`)"
      - "traefik.http.routers.diagnostics.entrypoints=web,websecure"
      - "traefik.http.routers.diagnostics.tls.certresolver=letsencrypt"
      - "traefik.http.routers.diagnostics.priority=10"
      - "traefik.http.services.diagnostics.loadbalancer.server.port=8082"
      - "traefik.http.routers.diagnostics.middlewares=diagnostics-stripprefix"
      - "traefik.http.middlewares.diagnostics-stripprefix.stripprefix.prefixes=/diagnostics"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Blueprint (port 8083) ──────────────────────────────────────────────────
  avry-blueprint:
    build:
      context: ./services/avry-blueprint
      dockerfile: Dockerfile
    container_name: avry-blueprint
    restart: unless-stopped
    networks:
      - aivory-network
    ports:
      - "8083:8083"
    environment:
      - N8N_BASE_URL=http://n8n:5678
      - PORT=8083
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8083/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aivory-network"
      - "traefik.http.routers.blueprint.rule=Host(`api.aivory.id`) && PathPrefix(`/blueprint`)"
      - "traefik.http.routers.blueprint.entrypoints=web,websecure"
      - "traefik.http.routers.blueprint.tls.certresolver=letsencrypt"
      - "traefik.http.routers.blueprint.priority=10"
      - "traefik.http.services.blueprint.loadbalancer.server.port=8083"
      - "traefik.http.routers.blueprint.middlewares=blueprint-stripprefix"
      - "traefik.http.middlewares.blueprint-stripprefix.stripprefix.prefixes=/blueprint"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Roadmap (port 8084) ────────────────────────────────────────────────────
  avry-roadmap:
    build:
      context: ./services/avry-roadmap
      dockerfile: Dockerfile
    container_name: avry-roadmap
    restart: unless-stopped
    networks:
      - aivory-network
    ports:
      - "8084:8084"
    environment:
      - N8N_BASE_URL=http://n8n:5678
      - PORT=8084
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8084/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aivory-network"
      - "traefik.http.routers.roadmap.rule=Host(`api.aivory.id`) && PathPrefix(`/roadmap`)"
      - "traefik.http.routers.roadmap.entrypoints=web,websecure"
      - "traefik.http.routers.roadmap.tls.certresolver=letsencrypt"
      - "traefik.http.routers.roadmap.priority=10"
      - "traefik.http.services.roadmap.loadbalancer.server.port=8084"
      - "traefik.http.routers.roadmap.middlewares=roadmap-stripprefix"
      - "traefik.http.middlewares.roadmap-stripprefix.stripprefix.prefixes=/roadmap"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Workflows (port 8082 internally, separate path) ────────────────────────
  avry-workflows:
    build:
      context: ./services/avry-workflows
      dockerfile: Dockerfile
    container_name: avry-workflows
    restart: unless-stopped
    networks:
      - aivory-network
    ports:
      - "8087:8087"
    environment:
      - N8N_BASE_URL=http://n8n:5678
      - PORT=8087
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8087/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aivory-network"
      - "traefik.http.routers.workflows.rule=Host(`api.aivory.id`) && PathPrefix(`/workflows`)"
      - "traefik.http.routers.workflows.entrypoints=web,websecure"
      - "traefik.http.routers.workflows.tls.certresolver=letsencrypt"
      - "traefik.http.routers.workflows.priority=10"
      - "traefik.http.services.workflows.loadbalancer.server.port=8087"
      - "traefik.http.routers.workflows.middlewares=workflows-stripprefix"
      - "traefik.http.middlewares.workflows-stripprefix.stripprefix.prefixes=/workflows"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Payments (port 3030) ───────────────────────────────────────────────────
  avry-payments:
    build:
      context: ./services/avry-payments
      dockerfile: Dockerfile
    container_name: avry-payments
    restart: unless-stopped
    networks:
      - aivory-network
    ports:
      - "3030:3030"
    environment:
      - N8N_BASE_URL=http://n8n:5678
      - PORT=3030
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY}
      # Listed one by one rather than via `env_file: .env`: this service parses
      # cors_origins as list[str], and the root .env carries a comma-separated
      # CORS_ORIGINS that pydantic-settings cannot decode, so pulling the whole
      # file in crashes it at startup.
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION}
      - FX_RATE_URL=${FX_RATE_URL}
      - FX_MARGIN_PERCENT=${FX_MARGIN_PERCENT}
      - FX_TTL_SECONDS=${FX_TTL_SECONDS}
      - USD_IDR_RATE=${USD_IDR_RATE}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      # Receipt delivery goes through the n8n workflow; SMTP_* stays as the
      # fallback path inside _send_receipt.
      - N8N_RECEIPT_WEBHOOK_URL=${N8N_RECEIPT_WEBHOOK_URL}
      - RECEIPT_EMAIL_TOKEN=${RECEIPT_EMAIL_TOKEN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - PAYMENTS_FROM_EMAIL=${PAYMENTS_FROM_EMAIL}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3030/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aivory-network"
      - "traefik.http.routers.payments.rule=(Host(`api.aivory.id`) || Host(`backend.aivory.id`)) && PathPrefix(`/payments`)"
      - "traefik.http.routers.payments.entrypoints=web,websecure"
      - "traefik.http.routers.payments.tls.certresolver=letsencrypt"
      - "traefik.http.routers.payments.priority=10"
      - "traefik.http.services.payments.loadbalancer.server.port=3030"
      - "traefik.http.routers.payments.middlewares=payments-stripprefix"
      - "traefik.http.middlewares.payments-stripprefix.stripprefix.prefixes=/payments"
    depends_on:
      postgres:
        condition: service_healthy

  avry-crm-db:
    image: postgres:16-alpine
    container_name: avry-crm-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=avry_crm
      - POSTGRES_PASSWORD=${CRM_DB_PASSWORD}
      - POSTGRES_DB=avry_crm
    volumes:
      - avry-crm-db-data:/var/lib/postgresql/data
    networks:
      - aivory-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avry_crm -d avry_crm"]
      interval: 30s
      timeout: 5s
      retries: 10

  avry-crm:
    build:
      context: ./services/avry-crm
      dockerfile: Dockerfile
    container_name: avry-crm
    restart: unless-stopped
    environment:
      - PORT=8091
      - DATABASE_URL=postgres://avry_crm:${CRM_DB_PASSWORD}@avry-crm-db:5432/avry_crm
      - CRM_SERVICE_TOKEN=${CRM_SERVICE_TOKEN}
    depends_on:
      avry-crm-db:
        condition: service_healthy
    networks:
      - aivory-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aivory-network"
      - "traefik.http.routers.avry-crm-mcp.rule=Host(`api.aivory.id`) && PathPrefix(`/crm/mcp`)"
      - "traefik.http.routers.avry-crm-mcp.entrypoints=websecure"
      - "traefik.http.routers.avry-crm-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.routers.avry-crm-mcp.priority=30"
      - "traefik.http.routers.avry-crm-mcp.middlewares=avry-crm-mcp-rl,avry-crm-mcp-strip"
      - "traefik.http.middlewares.avry-crm-mcp-rl.ratelimit.average=30"
      - "traefik.http.middlewares.avry-crm-mcp-rl.ratelimit.burst=60"
      - "traefik.http.middlewares.avry-crm-mcp-strip.stripprefix.prefixes=/crm"
      - "traefik.http.services.avry-crm-mcp.loadbalancer.server.port=8091"

networks:
  aivory-network:
    external: true
  aivory_aivory-net:
    external: true
  # AVRY-Mail webmail frontend (avry-mail-web) runs on this isolated
  # network; Traefik must be a member to route mail.aivory.uk to it.
  # Live-attached via 'docker network connect' on 2026-09-13 after a
  # 504 Gateway Timeout outage; this makes it declarative so a future
  # 'docker compose up -d traefik' does not regress it. NOT committed
  # to git -- this file has extensive uncommitted local drift, see
  # HANDOFF_2026-09-13-VPS-INFRA-DRIFT.md.
  avry-mail-web-edge:
    external: true

volumes:
  avry-dashboard-data:
  avry-crm-db-data:
  avry-backend-data:
  postgres_data:
  collab_data:
